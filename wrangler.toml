name = "daily-dose-auto-email"
main = "cloudflare-worker-paste.js"
compatibility_date = "2026-06-19"

# Preserve the existing production schedule exactly. The paired UTC hours
# keep delivery at 7am daily and 7pm Sunday in Europe/Dublin across DST.
[triggers]
crons = ["0 6 * * *", "0 7 * * *", "0 18 * * SUN", "0 19 * * SUN"]

[vars]
APP_TIME_ZONE = "Europe/Dublin"
BREVO_LIST_ID = "2"
NOTIFY_EMAIL = "dailydosedevotions@gmail.com"
BREVO_SENDER_NAME = "Daily Dose Devotions"
GITHUB_OWNER = "dailydosedevotions-oss"
GITHUB_REPO = "dailydosewebsite"
GITHUB_BRANCH = "main"
GITHUB_DEVOTION_PATH_TEMPLATE = "devotions/{date}.json"
SITE_URL = "https://dailydosedevotions.ie"

# Existing Cloudflare secret expected:
# BREVO_API_KEY
#
# Optional if your GitHub devotion files are in a private repo:
# GITHUB_TOKEN
#
# Optional anti-duplicate KV binding:
# SENT_DEVOTIONS
