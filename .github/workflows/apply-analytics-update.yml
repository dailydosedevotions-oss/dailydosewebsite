name: Apply reviewed analytics update

on:
  push:
    branches:
      - codex/analytics-consent-deployment
    paths:
      - .github/workflows/apply-analytics-update.yml

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed site update
        run: |
          git apply -p1 daily-dose-analytics-consent.patch
          rm daily-dose-analytics-consent.patch
          rm .github/workflows/apply-analytics-update.yml
      - name: Commit reviewed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add consent-controlled GA4 analytics"
          git push origin HEAD
